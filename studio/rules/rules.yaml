# Studio decision-tree rules — declarative thresholds (single source of truth).
#
# Parsed by studio/rules/engine.py, which has hardcoded fallbacks equal to every
# value here, so a parse miss is a no-op (never breaks a page). Tune these without
# code changes. Values marked NEEDS-SIGNOFF are defaults pending stakeholders
# (see studio/DESIGN.md §6).

truncation:
  trigger_rows: 20      # tables with <= this many rows show in full
  top_n: 10             # else show this many highest ...
  bottom_n: 10          # ... and this many lowest, by the page's sort metric

yoy:
  high_growth_pct: 100.0           # only surface YoY growth above this %
  significant_premium_floor: 1000000   # ...and only when current-year premium >= this  (NEEDS-SIGNOFF: $1M)
  always_show_both_years: true     # always render prior + current premium side by side
  always_include_current_and_prior: true  # commentary citing YoY must also cite current + prior premium
  require_absolute_change: true    # large-growth commentary must include the absolute movement
  suppress_if_current_premium_below: 1000000  # never narrate YoY on a book smaller than this

materiality:
  min_premium_for_industry_commentary: 5000000   # a segment needs >= this MARKET premium before
                                                 # it is worth a commentary line  (NEEDS-SIGNOFF: $5M)
  min_premium_for_practice_commentary: 5000000   # practice/product commentary floor  (NEEDS-SIGNOFF: $5M)
  min_share_of_portfolio_pct: 3.0                # ...or >= this share of the portfolio

drivers:
  require_driver_for_large_change: true   # a large move needs a decomposition fact before "driven by"
  large_change_pct: 20.0                  # |YoY %| above this counts as a large change
  min_driver_contribution_pct: 40.0       # a named driver must explain >= this share of the movement

commentary:
  max_bullets_per_slide: 3            # commentary contract: at most this many bullets per slide
  max_sentences_per_bullet: 2         # ...and this many sentences per bullet
  block_named_peer_mentions: true     # carrier-facing output never names an individual peer
  block_causal_language_without_driver_fact: true  # "drove/because" needs a decomposition fact
  min_binding_confidence: 0.5         # agent-suggested slot mappings below this are flagged for review

rank:
  window: 5             # compare carrier rank R against [R-window, R+window] excluding R  (NEEDS-SIGNOFF: 5)

whitespace:
  material_market_gwp: 5000000   # market (Marsh) GWP must exceed this to count as whitespace ($5M)
  carrier_ceiling: 0.0           # carrier GWP must be <= this to count as a gap  (NEEDS-SIGNOFF: ~0)
  top_n: 5                       # keep the N biggest gaps by market GWP

peer:
  aggregate_only: true   # confidentiality: peer comparisons are AVERAGES only, never named peers

# How one scope is decomposed into industries / client segments, and what makes a
# decomposed row worth a sentence. Read by studio/segments.py. The ABSENT class
# reuses the `whitespace:` block above (same rule, same thresholds) and the
# market-premium floor is `materiality.min_premium_for_industry_commentary`.
segments:
  dims: [SIC_Major_Class, Client_Segment]  # the decompositions commentary may use.
                                           # NOT SIC_Minor_Class (all "— General" suffixes in
                                           # the seed, no signal); NOT Business_Line/Cover_Line.
  min_carriers: 3          # fewer carriers placed here and a "top-5 average" identifies one
                           # of them — a confidentiality floor, not a statistical one
  thin_share_margin: 2.0   # share this far below the carrier's OWN placed average is THIN
  behind_peer_margin: 1.0  # ...and this far below the top-5 peer average is BEHIND
  strong_share_margin: 2.0 # this far ABOVE its own placed average is the proof point
  losing_share_move: 1.0   # share given back, percentage points, to count as LOSING
  deviation_pp: 1.5        # a child scope departs from its parent by at least this before
                           # the finding belongs to the child rather than the parent
  max_findings_per_column: 2   # how many segment lines one commentary column may carry

opportunity:
  top_n: 5               # keep the N biggest whitespace candidates as opportunity bubbles

temporal:
  ttm_min_months: 12     # need at least this many months of history before a TTM trend is shown
  mom_significant_pct: 5.0   # |MoM %| above this is called out as a material monthly swing
  qoq_significant_pct: 8.0   # |QoQ %| above this is called out as a material quarterly swing

# SWOT quadrant selectors — fact-driven (DESIGN.md §1). Each quadrant lists the
# signals that route a fact into it. v1 placeholders; thresholds reuse the blocks
# above. Expanded when the Country/SWOT page is built.
swot:
  strengths:   [high_premium, high_share_of_portfolio, high_share_of_wallet, strong_rank, above_peer_score]
  weaknesses:  [below_peer_score, negative_yoy_significant]
  opportunities: [whitespace, high_growth_significant]
  threats:     [peer_outgrowing, declining_rank, eroding_share_of_wallet]

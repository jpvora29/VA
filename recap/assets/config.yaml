# ── Company & Team Context ────────────────────────────────────────────────────
# Plain-text context injected into LLM system prompts so every enrichment,
# classification, and recap call understands what Marsh and the ICG team are.
# Edit this section freely — no code changes are needed.
context:
  marsh: |
    Marsh is a global leader in insurance broking and risk advisory. The firm
    helps organisations manage uncertainty across areas including property,
    casualty, cyber, marine, energy, financial lines, and specialty risks.
    Marsh acts as an advisor and broker that helps clients: assess and quantify
    risk; design insurance programmes; negotiate with insurers; support claims
    and renewals; and improve resilience and risk management.
    Marsh is part of Marsh McLennan.

  icg: |
    The Insurer Consulting Group (ICG) sits within Marsh's Strategic Carrier
    Services function. ICG focuses on the insurer side of the market and
    supports: insurer relationship management; market-facing consulting and
    advisory; analysis of insurer performance, appetite, and strategy;
    supporting placement conversations with insurers; creating insights on
    capacity, pricing, and coverage trends; and helping Marsh teams position
    risk to insurers more effectively.
    ICG helps Marsh understand what insurers want, how insurers are behaving in
    the market, where the best opportunities are for placement or negotiation,
    and how to strengthen Marsh's relationships with insurer partners.
    This is important because Marsh depends on strong insurer relationships to
    secure competitive coverage for clients — ICG bridges the gap between
    client needs, market realities, and insurer expectations.



# QBR Recap App — Reference Configuration
# ─────────────────────────────────────────────────────────────────────────────
# All lists here are loaded at pipeline startup from assets/config.yaml.
# To add a new carrier, country, region, or line of business, edit this file —
# no code changes are needed.
#
# Matching is case-insensitive substring search against the extracted slide text.
# Order within each list does not affect matching; the pipeline prefers whichever
# entry appears first on slide 1 of the uploaded deck for carrier / quarter / year
# detection, then falls back to the full deck text.
# ─────────────────────────────────────────────────────────────────────────────


# ── Carriers ────────────────────────────────────────────────────────────────
# Add any insurer or Lloyd's syndicate that appears as a QBR counterparty.
#
# Each entry is a canonical name followed by zero or more aliases — alternate
# names, sub-company names, or regional variants that should resolve to the
# same carrier.  Matching is case-insensitive word-boundary search against
# slide text.  The FIRST entry that matches wins, so list the most specific
# sub-company variants BEFORE the generic parent name to avoid a short parent
# name (e.g. "AIG") swallowing a more specific hit (e.g. "AIG Talbot").
#
# Format:
#   canonical: <display name used in output>
#   aliases:   [list of alternate names to match in slide text]
#
# IMPORTANT — ordering within aliases does not matter (all are tried);
# ordering between carrier blocks DOES matter (first match wins).
carriers:


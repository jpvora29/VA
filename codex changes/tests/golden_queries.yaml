golden_queries:
  - id: gpr_sow_product
    flow: gpr
    query: "What is Zurich share of wallet in Canada by product for 2025?"
    expected_skills:
      - gpr-share-of-wallet
      - gpr-marsh-market
      - cross-sql-readonly-safety
    expected_sql:
      tables: [GPR]
      required_columns: [Carrier_Group, Country, Product_Line, Premium]
      forbidden_columns: [Carrier_Name]
      denominator_without_carrier_filter: true

  - id: gpr_share_of_portfolio
    flow: gpr
    query: "Show Zurich appetite by product in Canada for 2025."
    expected_skills:
      - gpr-share-of-portfolio
    expected_response_terms:
      - "Share of Portfolio"
    forbidden_response_terms:
      - "appetite"

  - id: survey_peer_score
    flow: survey
    query: "Compare Zurich score with peers in Singapore for 2025."
    expected_skills:
      - survey-peer-average
      - cross-peer-confidentiality
    expected_sql:
      tables: [Carriers, Peers]
      required_aggregates: [AVG]
    forbidden_output:
      - individual_peer_names

  - id: pitch_whitespace
    flow: gpr
    query: "Where is Zurich whitespace in Canada?"
    expected_skills:
      - pitch-whitespace
      - gpr-marsh-market
    required_evidence:
      - carrier_premium
      - market_or_peer_premium
      - slice_label


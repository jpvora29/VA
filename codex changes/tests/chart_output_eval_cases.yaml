chart_output_eval_cases:
  - id: year_category_bar
    description: Multi-year product comparison should be grouped bars, not a line.
    user_query: "Show premium by product for Zurich in Canada for 2023, 2024, and 2025."
    rows:
      - {Year: 2023, Product_Line: Property, Premium: 1200000}
      - {Year: 2023, Product_Line: Casualty, Premium: 800000}
      - {Year: 2024, Product_Line: Property, Premium: 1300000}
      - {Year: 2024, Product_Line: Casualty, Premium: 700000}
      - {Year: 2025, Product_Line: Property, Premium: 1500000}
      - {Year: 2025, Product_Line: Casualty, Premium: 900000}
    expected_chart_type: bar
    expected_x: Year
    expected_series: Product_Line
    forbidden_chart_type: line
    axis_assertions:
      - no_fractional_year_ticks
      - ticks_are_2023_2024_2025

  - id: explicit_year_trend_line
    description: Explicit trend over years can be a line.
    user_query: "Show Zurich premium trend over time from 2023 to 2025."
    rows:
      - {Year: 2023, Premium: 1200000}
      - {Year: 2024, Premium: 1300000}
      - {Year: 2025, Premium: 1500000}
    expected_chart_type: line
    expected_x: Year
    expected_y: [Premium]
    axis_assertions:
      - no_fractional_year_ticks

  - id: one_year_breakdown_bar
    description: One-year section breakdown should be bar.
    user_query: "Show score by section for Zurich in Singapore in 2025."
    rows:
      - {Survey_Year: 2025, Section: Claims, Score: 7.2}
      - {Survey_Year: 2025, Section: Underwriting, Score: 6.8}
      - {Survey_Year: 2025, Section: Servicing, Score: 7.5}
    expected_chart_type: bar
    expected_x: Section
    forbidden_chart_type: line

  - id: top_carriers_two_years_bar
    description: Ranking across years should not connect carriers with lines.
    user_query: "Top 5 carriers by premium in 2024 and 2025."
    rows:
      - {Year: 2024, Carrier_Group: A, Premium: 10}
      - {Year: 2024, Carrier_Group: B, Premium: 8}
      - {Year: 2025, Carrier_Group: A, Premium: 12}
      - {Year: 2025, Carrier_Group: B, Premium: 7}
    expected_chart_type: bar
    expected_x: Year
    expected_series: Carrier_Group
    forbidden_chart_type: line
    axis_assertions:
      - no_fractional_year_ticks


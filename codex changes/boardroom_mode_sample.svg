<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .nav { fill: #000f47; }
      .sidebar { fill: #ffffff; stroke: #d9e0ec; }
      .panel { fill: #ffffff; stroke: #dfe6f2; stroke-width: 1; rx: 8; }
      .panel-soft { fill: #f9fbff; stroke: #dfe6f2; stroke-width: 1; rx: 8; }
      .title { font: 800 30px Inter, Segoe UI, Arial, sans-serif; fill: #0b1320; }
      .h2 { font: 800 17px Inter, Segoe UI, Arial, sans-serif; fill: #0b1320; }
      .h3 { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #1c2636; }
      .label { font: 600 11px Inter, Segoe UI, Arial, sans-serif; fill: #5b6577; letter-spacing: .2px; }
      .small { font: 500 11px Inter, Segoe UI, Arial, sans-serif; fill: #5b6577; }
      .tiny { font: 500 10px Inter, Segoe UI, Arial, sans-serif; fill: #718096; }
      .num { font: 800 24px Inter, Segoe UI, Arial, sans-serif; fill: #0b1320; }
      .navtext { font: 700 18px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .white { fill: #ffffff; }
      .blue { fill: #0b4bff; }
      .navy { fill: #000f47; }
      .red { fill: #c53532; }
      .teal { fill: #00a6a6; }
      .yellow { fill: #f0b429; }
      .green { fill: #1f9d55; }
      .muted { fill: #eef3fa; }
      .axis { stroke: #cad3df; stroke-width: 1; }
      .grid { stroke: #edf1f7; stroke-width: 1; }
      .shadow { filter: drop-shadow(0 8px 22px rgba(10,22,54,.08)); }
    </style>
  </defs>

  <rect class="bg" width="1440" height="960"/>
  <rect class="nav" x="0" y="0" width="1440" height="58"/>
  <text class="navtext" x="42" y="36">Virtual Analyst</text>
  <text class="small" x="1218" y="35" fill="#dce7ff">Boardroom Mode Preview</text>

  <rect class="sidebar shadow" x="18" y="82" width="74" height="826" rx="14"/>
  <circle class="muted" cx="55" cy="126" r="18"/>
  <rect class="navy" x="41" y="184" width="28" height="28" rx="8"/>
  <rect class="muted" x="41" y="234" width="28" height="28" rx="8"/>
  <rect class="muted" x="41" y="284" width="28" height="28" rx="8"/>
  <rect class="muted" x="41" y="334" width="28" height="28" rx="8"/>

  <text class="title" x="124" y="112">Boardroom Mode</text>
  <text class="small" x="124" y="136">ZURICH GROUP - Canada - 2025 | Executive carrier performance cockpit</text>

  <rect class="panel" x="900" y="84" width="366" height="46" rx="23"/>
  <rect class="navy" x="908" y="91" width="122" height="32" rx="16"/>
  <text class="small white" x="933" y="112">Command</text>
  <text class="small" x="1051" y="112">Risks</text>
  <text class="small" x="1120" y="112">Opportunities</text>
  <text class="small" x="1226" y="112">Peers</text>
  <rect class="blue" x="1282" y="84" width="128" height="46" rx="23"/>
  <text class="small white" x="1302" y="112">Pitch Pack</text>

  <!-- KPI strip -->
  <g class="shadow">
    <rect class="panel" x="124" y="166" width="196" height="104"/>
    <rect class="panel" x="334" y="166" width="174" height="104"/>
    <rect class="panel" x="522" y="166" width="174" height="104"/>
    <rect class="panel" x="710" y="166" width="174" height="104"/>
    <rect class="panel" x="898" y="166" width="174" height="104"/>
    <rect class="panel" x="1086" y="166" width="186" height="104"/>
  </g>
  <text class="label" x="144" y="194">PREMIUM</text><text class="num" x="144" y="230">$57.6M</text><text class="small red" x="144" y="252">-9.2% YoY</text>
  <text class="label" x="354" y="194">GPR RANK</text><text class="num" x="354" y="230">#14</text><text class="small red" x="354" y="252">down 4 places</text>
  <text class="label" x="542" y="194">BROKER SCORE</text><text class="num" x="542" y="230">7.1</text><text class="small green" x="542" y="252">+0.3 vs prior</text>
  <text class="label" x="730" y="194">SHARE OF WALLET</text><text class="num" x="730" y="230">12.4%</text><text class="small" x="730" y="252">near peer avg</text>
  <text class="label" x="918" y="194">PORTFOLIO MIX</text><text class="num" x="918" y="230">62%</text><text class="small" x="918" y="252">Property-heavy</text>
  <text class="label" x="1106" y="194">HEALTH SCORE</text><text class="num" x="1106" y="230">68/100</text><text class="small yellow" x="1106" y="252">watchlist</text>

  <!-- Command center -->
  <rect class="panel shadow" x="124" y="294" width="552" height="282"/>
  <text class="h2" x="148" y="326">Carrier Command Center</text>
  <text class="small" x="148" y="348">Premium, rank, broker sentiment, and share movement in one board-ready view.</text>
  <line class="axis" x1="164" y1="522" x2="632" y2="522"/>
  <line class="axis" x1="164" y1="388" x2="164" y2="522"/>
  <line class="grid" x1="164" y1="486" x2="632" y2="486"/>
  <line class="grid" x1="164" y1="450" x2="632" y2="450"/>
  <line class="grid" x1="164" y1="414" x2="632" y2="414"/>
  <rect class="blue" x="198" y="438" width="38" height="84" rx="6"/>
  <rect class="blue" x="278" y="417" width="38" height="105" rx="6"/>
  <rect class="blue" x="358" y="401" width="38" height="121" rx="6"/>
  <rect class="red" x="438" y="456" width="38" height="66" rx="6"/>
  <rect class="blue" x="518" y="442" width="38" height="80" rx="6"/>
  <polyline points="217,430 297,413 377,390 457,455 537,438" fill="none" stroke="#00a6a6" stroke-width="4"/>
  <circle class="teal" cx="217" cy="430" r="5"/><circle class="teal" cx="297" cy="413" r="5"/><circle class="teal" cx="377" cy="390" r="5"/><circle class="teal" cx="457" cy="455" r="5"/><circle class="teal" cx="537" cy="438" r="5"/>
  <text class="tiny" x="198" y="544">2021</text><text class="tiny" x="278" y="544">2022</text><text class="tiny" x="358" y="544">2023</text><text class="tiny" x="438" y="544">2024</text><text class="tiny" x="518" y="544">2025</text>

  <!-- Opportunity/Risk Radar -->
  <rect class="panel shadow" x="700" y="294" width="334" height="282"/>
  <text class="h2" x="724" y="326">Opportunity / Risk Radar</text>
  <line class="axis" x1="748" y1="438" x2="994" y2="438"/>
  <line class="axis" x1="872" y1="350" x2="872" y2="536"/>
  <text class="tiny" x="752" y="365">Defend</text><text class="tiny" x="932" y="365">Grow</text>
  <text class="tiny" x="748" y="532">Monitor</text><text class="tiny" x="924" y="532">Investigate</text>
  <circle class="teal" cx="948" cy="392" r="28" opacity=".92"/><text class="tiny white" x="925" y="396">Cyber</text>
  <circle class="blue" cx="806" cy="397" r="34" opacity=".92"/><text class="tiny white" x="779" y="401">Property</text>
  <circle class="red" cx="932" cy="492" r="31" opacity=".92"/><text class="tiny white" x="913" y="496">Claims</text>
  <circle class="yellow" cx="802" cy="488" r="24" opacity=".92"/><text class="tiny" x="780" y="492">Casualty</text>

  <!-- Health score -->
  <rect class="panel shadow" x="1058" y="294" width="214" height="282"/>
  <text class="h2" x="1082" y="326">Carrier Health Score</text>
  <circle cx="1165" cy="428" r="74" fill="none" stroke="#edf1f7" stroke-width="18"/>
  <path d="M1165 354 A74 74 0 1 1 1098 459" fill="none" stroke="#f0b429" stroke-width="18" stroke-linecap="round"/>
  <text class="num" x="1126" y="438">68</text><text class="small" x="1170" y="438">/100</text>
  <text class="small" x="1082" y="530">Drivers: rank decline, premium dip,</text>
  <text class="small" x="1082" y="550">but perception improved.</text>

  <!-- Bottom row -->
  <rect class="panel shadow" x="124" y="604" width="372" height="248"/>
  <text class="h2" x="148" y="636">Peer Positioning Matrix</text>
  <line class="axis" x1="166" y1="806" x2="454" y2="806"/><line class="axis" x1="166" y1="666" x2="166" y2="806"/>
  <line class="grid" x1="310" y1="666" x2="310" y2="806"/><line class="grid" x1="166" y1="736" x2="454" y2="736"/>
  <text class="tiny" x="176" y="682">Broker perception</text><text class="tiny" x="343" y="824">Premium strength</text>
  <circle class="blue" cx="338" cy="704" r="10"/><text class="small" x="354" y="708">Zurich</text>
  <circle class="teal" cx="300" cy="740" r="8"/><text class="small" x="314" y="744">Peer avg</text>
  <circle class="red" cx="386" cy="764" r="8"/><text class="small" x="400" y="768">Marsh book</text>

  <rect class="panel shadow" x="522" y="604" width="352" height="248"/>
  <text class="h2" x="546" y="636">What Changed Since Last Year</text>
  <rect class="panel-soft" x="548" y="660" width="300" height="42"/><text class="h3" x="566" y="686">Premium fell 9.2%</text><text class="tiny" x="750" y="686">2024 -> 2025</text>
  <rect class="panel-soft" x="548" y="714" width="300" height="42"/><text class="h3" x="566" y="740">Rank moved from #10 to #14</text>
  <rect class="panel-soft" x="548" y="768" width="300" height="42"/><text class="h3" x="566" y="794">Broker score improved +0.3</text>
  <circle class="red" cx="838" cy="681" r="6"/><circle class="red" cx="838" cy="735" r="6"/><circle class="green" cx="838" cy="789" r="6"/>

  <rect class="panel shadow" x="900" y="604" width="372" height="248"/>
  <text class="h2" x="924" y="636">Risk Radar</text>
  <text class="label" x="924" y="668">HIGH</text><rect class="red" x="970" y="654" width="156" height="18" rx="9"/><text class="small" x="1140" y="668">Rank decline</text>
  <text class="label" x="924" y="710">MED</text><rect class="yellow" x="970" y="696" width="112" height="18" rx="9"/><text class="small" x="1140" y="710">Property concentration</text>
  <text class="label" x="924" y="752">MED</text><rect class="yellow" x="970" y="738" width="96" height="18" rx="9"/><text class="small" x="1140" y="752">Casualty softness</text>
  <text class="label" x="924" y="794">LOW</text><rect class="green" x="970" y="780" width="74" height="18" rx="9"/><text class="small" x="1140" y="794">Broker score trend</text>

  <rect class="panel" x="318" y="884" width="804" height="48" rx="24"/>
  <text class="small" x="348" y="913">Ask: "Why did Zurich rank decline and where is the strongest whitespace?"</text>
  <circle class="blue" cx="1082" cy="908" r="18"/><text class="white" x="1077" y="914" font-family="Arial" font-size="18">+</text>
</svg>

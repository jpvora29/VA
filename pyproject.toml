[project]
name = "virtual-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.2.0",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "deepagents>=0.6.12",
    "langchain>=1.3.4",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=1.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "plotly-express>=0.4.1",
    # Renders the Carrier Survey ribbon chart to PNG (studio/template_fill/survey/ribbon.py).
    # v1+ only: 0.2.1 hangs indefinitely on Windows. Needs a Chrome/Chromium on the host;
    # `plotly_get_chrome` fetches one where none exists. The survey page degrades to the
    # authored picture when it is unavailable, so this is a soft runtime requirement.
    "kaleido>=1.0.0",
    "pydantic>=2.13.4",
    # Reads the meeting-note PDF for the MoM workspace (mom/notes.py, imported as
    # `fitz`). >=1.23 for `page.find_tables()`, which is how tables in a note survive
    # into the prompt.
    "pymupdf>=1.24",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "pywin32>=311; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.50",
    # Legacy .xls uploads on the Studio Data page (pandas needs this engine; openpyxl
    # only handles the OOXML .xlsx/.xlsm formats).
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# ``studio``/``core`` are imported as top-level packages from the repo root.
pythonpath = ["."]
markers = [
    "e2e: end-to-end run over the real templates (slow; deselect with -m 'not e2e')",
]
